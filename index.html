<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hissaab — Shared trip expense tracking, fair splits, and easy settlements." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1c2430" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Hissaab — Shared Expense Tracking</title>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('hissaab-theme');
          var isDark = stored === 'dark' || (stored !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
